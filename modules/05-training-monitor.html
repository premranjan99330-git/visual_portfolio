<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&family=Barlow+Condensed:wght@700;900&display=swap');
  :root{--bg:#12121f;--surface:#1a1a2e;--border:#252540;--cyan:#00e5ff;--pink:#ff4081;--yellow:#ffeb3b;--green:#69f0ae;--text:#e0e0e8;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Roboto Mono',monospace;min-height:100vh;}
  .hdr{padding:20px 36px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .brand{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:900;letter-spacing:4px;color:var(--cyan);}
  .epoch-badge{background:var(--border);border:1px solid var(--cyan);padding:6px 16px;font-size:0.65rem;color:var(--cyan);letter-spacing:2px;}
  .controls{display:flex;gap:12px;padding:20px 36px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;}
  .btn{background:transparent;border:1px solid var(--border);color:var(--text);font-family:'Roboto Mono',monospace;font-size:0.6rem;padding:6px 16px;cursor:pointer;letter-spacing:2px;transition:all 0.2s;}
  .btn:hover,.btn.active{border-color:var(--cyan);color:var(--cyan);}
  .btn.run{border-color:var(--green);color:var(--green);}
  .btn.run:hover{background:var(--green);color:var(--bg);}
  .btn.stop{border-color:var(--pink);color:var(--pink);}
  select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'Roboto Mono',monospace;font-size:0.6rem;padding:6px 10px;}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
  .kpi{background:var(--surface);padding:16px 20px;}
  .kpi-lbl{font-size:0.5rem;letter-spacing:2px;color:#555;margin-bottom:4px;}
  .kpi-v{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:700;}
  .kpi-d{font-size:0.55rem;margin-top:2px;}
  .main-charts{display:grid;grid-template-columns:2fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
  .ch{background:var(--surface);padding:20px;}
  .ch-title{font-size:0.55rem;letter-spacing:3px;color:#555;margin-bottom:12px;display:flex;justify-content:space-between;}
  canvas{display:block;width:100%;}
  .bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);}
  .mini{background:var(--surface);padding:16px;}
  .mini-title{font-size:0.5rem;letter-spacing:2px;color:#555;margin-bottom:10px;}
  .table{width:100%;border-collapse:collapse;font-size:0.58rem;}
  .table th{color:#555;font-weight:400;letter-spacing:2px;padding:4px 6px;text-align:left;font-size:0.5rem;border-bottom:1px solid var(--border);}
  .table td{padding:5px 6px;border-bottom:1px solid var(--border);color:var(--text);}
  .table tr:last-child td{color:var(--cyan);}
</style>
</head>
<body>
<div class="hdr">
  <div class="brand">TRAINING MONITOR</div>
  <div class="epoch-badge" id="epochBadge">EPOCH 0 / 100</div>
</div>
<div class="controls">
  <button class="btn run" id="runBtn" onclick="toggleTrain()">▶ START TRAINING</button>
  <button class="btn stop" onclick="resetTrain()">■ RESET</button>
  <select id="modelSel">
    <option>ResNet-50</option><option>Transformer-Base</option><option>LSTM-256</option><option>MobileNet-V3</option>
  </select>
  <select id="lrSel">
    <option>LR: 0.001</option><option>LR: 0.0001</option><option>LR: 0.01</option>
  </select>
  <select id="bsSel">
    <option>BATCH: 32</option><option>BATCH: 64</option><option>BATCH: 128</option>
  </select>
  <button class="btn active">ADAM</button>
  <button class="btn">SGD</button>
  <button class="btn">RMSPROP</button>
</div>
<div class="kpis">
  <div class="kpi"><div class="kpi-lbl">TRAIN LOSS</div><div class="kpi-v" id="kTL" style="color:var(--pink)">—</div><div class="kpi-d" id="kTLd">—</div></div>
  <div class="kpi"><div class="kpi-lbl">VAL LOSS</div><div class="kpi-v" id="kVL" style="color:var(--yellow)">—</div><div class="kpi-d" id="kVLd">—</div></div>
  <div class="kpi"><div class="kpi-lbl">TRAIN ACC</div><div class="kpi-v" id="kTA" style="color:var(--cyan)">—</div><div class="kpi-d" id="kTAd">—</div></div>
  <div class="kpi"><div class="kpi-lbl">VAL ACC</div><div class="kpi-v" id="kVA" style="color:var(--green)">—</div><div class="kpi-d" id="kVAd">—</div></div>
  <div class="kpi"><div class="kpi-lbl">BEST VAL ACC</div><div class="kpi-v" id="kBA" style="color:var(--green)">—</div><div class="kpi-d" id="kBAd" style="color:#555">—</div></div>
</div>
<div class="main-charts">
  <div class="ch"><div class="ch-title"><span>LOSS CURVES</span><span id="lossLive" style="color:var(--pink)">—</span></div><canvas id="lossC" height="220"></canvas></div>
  <div class="ch"><div class="ch-title"><span>ACCURACY</span><span id="accLive" style="color:var(--green)">—</span></div><canvas id="accC" height="220"></canvas></div>
</div>
<div class="bottom">
  <div class="mini"><div class="mini-title">LEARNING RATE SCHEDULE</div><canvas id="lrC" height="100"></canvas></div>
  <div class="mini"><div class="mini-title">GRADIENT NORM</div><canvas id="gnC" height="100"></canvas></div>
  <div class="mini">
    <div class="mini-title">EPOCH LOG</div>
    <table class="table">
      <thead><tr><th>EP</th><th>TR LOSS</th><th>VA LOSS</th><th>VA ACC</th></tr></thead>
      <tbody id="logTable"></tbody>
    </table>
  </div>
</div>
<script>
let running=false, epoch=0, timer=null;
const trainLoss=[], valLoss=[], trainAcc=[], valAcc=[], lrLog=[], gnLog=[];
let bestValAcc=0, bestEpoch=0;
function genEpoch(ep){
  const prog=ep/100;
  const tl=Math.max(0.05, 2.4*Math.exp(-prog*3.5)+Math.random()*0.08);
  const vl=Math.max(0.08, 2.2*Math.exp(-prog*3.0)+Math.random()*0.12+(prog>0.7?(prog-0.7)*0.8:0));
  const ta=Math.min(0.999,0.3+prog*0.68+Math.random()*0.02);
  const va=Math.min(0.995,0.28+prog*0.65+Math.random()*0.025-(prog>0.7?(prog-0.7)*0.05:0));
  const lr=0.001*Math.pow(0.95,ep);
  const gn=0.5+Math.random()*1.5*Math.exp(-prog*2);
  return{tl,vl,ta,va,lr,gn};
}
function drawLine(canvas,datasets,colors,dotted,yLabel){
  const W=canvas.parentElement.clientWidth-40; canvas.width=W; canvas.height=canvas.height||220;
  const H=canvas.height; const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);
  if(!datasets[0].length) return;
  const allVals=datasets.flat(); const maxV=Math.max(...allVals)*1.1; const minV=Math.min(...allVals)*0.9;
  const pad=32;
  ctx.strokeStyle='#252540'; ctx.lineWidth=1; ctx.setLineDash([2,4]);
  for(let i=0;i<=4;i++){
    const y=pad+(H-pad*2)*i/4;
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W,y); ctx.stroke();
    ctx.font='8px Roboto Mono'; ctx.fillStyle='#444'; ctx.textAlign='right';
    ctx.fillText((maxV-(maxV-minV)*i/4).toFixed(3),pad-4,y+3);
  }
  ctx.setLineDash([]);
  datasets.forEach((data,di)=>{
    if(!data.length) return;
    ctx.beginPath();
    if(dotted&&di===1) ctx.setLineDash([6,3]); else ctx.setLineDash([]);
    ctx.strokeStyle=colors[di]; ctx.lineWidth=2;
    data.forEach((v,i)=>{
      const x=pad+(i/(Math.max(data.length-1,1)))*(W-pad);
      const y=pad+((maxV-v)/(maxV-minV))*(H-pad*2);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
  });
}
function drawMini(canvas,data,color){
  const W=canvas.parentElement.clientWidth-32; canvas.width=W; canvas.height=100;
  const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,W,100);
  if(!data.length) return;
  const maxV=Math.max(...data); const minV=Math.min(...data);
  const pad=20;
  ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=1.5;
  data.forEach((v,i)=>{
    const x=i/(Math.max(data.length-1,1))*(W-pad)+pad;
    const y=pad+((maxV-v)/Math.max(maxV-minV,0.0001))*(100-pad*2);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();
}
function updateUI(){
  const ep=epoch;
  document.getElementById('epochBadge').textContent=`EPOCH ${ep} / 100`;
  if(!trainLoss.length) return;
  const tl=trainLoss[trainLoss.length-1], vl=valLoss[valLoss.length-1];
  const ta=trainAcc[trainAcc.length-1], va=valAcc[valAcc.length-1];
  document.getElementById('kTL').textContent=tl.toFixed(4);
  document.getElementById('kVL').textContent=vl.toFixed(4);
  document.getElementById('kTA').textContent=(ta*100).toFixed(1)+'%';
  document.getElementById('kVA').textContent=(va*100).toFixed(1)+'%';
  if(va>bestValAcc){bestValAcc=va;bestEpoch=ep;}
  document.getElementById('kBA').textContent=(bestValAcc*100).toFixed(1)+'%';
  document.getElementById('kBAd').textContent=`EP ${bestEpoch}`;
  document.getElementById('lossLive').textContent=`TL:${tl.toFixed(3)} VL:${vl.toFixed(3)}`;
  document.getElementById('accLive').textContent=`VA:${(va*100).toFixed(1)}%`;
  drawLine(document.getElementById('lossC'),[trainLoss,valLoss],['#ff4081','#ffeb3b'],true);
  drawLine(document.getElementById('accC'),[trainAcc,valAcc],['#00e5ff','#69f0ae'],false);
  drawMini(document.getElementById('lrC'),lrLog,'#00e5ff');
  drawMini(document.getElementById('gnC'),gnLog,'#ff4081');
  // Log table
  const tb=document.getElementById('logTable');
  const row=document.createElement('tr');
  row.innerHTML=`<td>${ep}</td><td>${tl.toFixed(4)}</td><td>${vl.toFixed(4)}</td><td>${(va*100).toFixed(1)}%</td>`;
  if(tb.children.length>8) tb.removeChild(tb.firstChild);
  tb.appendChild(row);
}
function step(){
  if(epoch>=100){stopTrain();return;}
  epoch++;
  const d=genEpoch(epoch);
  trainLoss.push(d.tl); valLoss.push(d.vl); trainAcc.push(d.ta); valAcc.push(d.va);
  lrLog.push(d.lr); gnLog.push(d.gn);
  updateUI();
}
function toggleTrain(){
  if(running){stopTrain();}else{startTrain();}
}
function startTrain(){
  running=true;
  document.getElementById('runBtn').textContent='⏸ PAUSE';
  timer=setInterval(step,200);
}
function stopTrain(){
  running=false;
  document.getElementById('runBtn').textContent='▶ RESUME';
  clearInterval(timer);
}
function resetTrain(){
  stopTrain(); epoch=0;
  trainLoss.length=valLoss.length=trainAcc.length=valAcc.length=lrLog.length=gnLog.length=0;
  bestValAcc=0; bestEpoch=0;
  document.getElementById('runBtn').textContent='▶ START TRAINING';
  document.getElementById('epochBadge').textContent='EPOCH 0 / 100';
  document.getElementById('logTable').innerHTML='';
  ['kTL','kVL','kTA','kVA','kBA'].forEach(id=>document.getElementById(id).textContent='—');
  updateUI();
}
updateUI();
</script>
</body>
</html>
