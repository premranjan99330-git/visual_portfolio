<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Leaderboard — Ethar AI</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0E0E12;
    --panel:#15151B;
    --border:#2A2A35;
    --gold:#FFB400;
    --silver:#A0A0B0;
    --bronze:#CD7C3A;
    --green:#22D46A;
    --red:#F23636;
    --blue:#4F8EF7;
    --text:#E8E8F0;
    --muted:#5A5A70;
    --font-h:'Oswald',sans-serif;
    --font-m:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body { background:var(--bg); color:var(--text); font-family:var(--font-m); min-height:100vh; }

  /* hero banner */
  .hero {
    background: linear-gradient(135deg, #FFB400 0%, #F23636 50%, #4F8EF7 100%);
    padding:3px 0 0;
  }
  .hero-inner {
    background:var(--bg);
    padding:40px 56px 32px;
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  h1 { font-family:var(--font-h); font-size:52px; font-weight:700; line-height:1; letter-spacing:2px; }
  h1 em { color:var(--gold); font-style:normal; }
  .hero-sub { font-size:12px; letter-spacing:2px; color:var(--muted); margin-top:8px; }
  .hero-right { text-align:right; }
  .hero-stat { font-family:var(--font-h); font-size:36px; font-weight:700; color:var(--gold); }
  .hero-stat-lbl { font-size:10px; letter-spacing:3px; color:var(--muted); }

  /* filters */
  .filters {
    padding:20px 56px;
    display:flex; gap:8px;
    border-bottom:1px solid var(--border);
  }
  .filter-btn {
    padding:6px 16px; border:1px solid var(--border);
    background:none; color:var(--muted); font-family:var(--font-m);
    font-size:11px; letter-spacing:2px; text-transform:uppercase; cursor:pointer;
    transition:all .2s;
  }
  .filter-btn.active, .filter-btn:hover {
    background:var(--gold); color:var(--bg); border-color:var(--gold); font-weight:700;
  }

  /* table */
  .table-wrap { padding:0 56px 56px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; margin-top:0; }
  thead tr { border-bottom:2px solid var(--gold); }
  thead th {
    padding:20px 16px;
    font-family:var(--font-h); font-size:12px; letter-spacing:3px; font-weight:500;
    text-transform:uppercase; color:var(--muted); text-align:left;
  }
  thead th.num { text-align:right; }
  tbody tr {
    border-bottom:1px solid var(--border);
    transition:background .15s;
    animation: slideIn .4s ease both;
  }
  tbody tr:hover { background:var(--panel); }
  tbody td { padding:20px 16px; font-size:13px; vertical-align:middle; }
  tbody td.num { text-align:right; font-family:var(--font-m); }

  .rank {
    font-family:var(--font-h); font-size:28px; font-weight:700;
    width:48px; display:inline-block; text-align:center;
  }
  .rank.gold { color:var(--gold); }
  .rank.silver { color:var(--silver); }
  .rank.bronze { color:var(--bronze); }
  .rank.normal { color:var(--muted); font-size:18px; }

  .model-name { font-family:var(--font-h); font-size:18px; font-weight:700; letter-spacing:.5px; }
  .model-org { font-size:11px; color:var(--muted); margin-top:3px; }
  .model-type {
    display:inline-block; padding:2px 8px;
    border:1px solid;
    font-size:9px; letter-spacing:2px; text-transform:uppercase; margin-top:4px;
  }
  .type-llm { border-color:var(--blue); color:var(--blue); }
  .type-vision { border-color:var(--green); color:var(--green); }
  .type-multi { border-color:var(--gold); color:var(--gold); }

  .score-bar-wrap { display:flex; align-items:center; gap:12px; min-width:200px; }
  .score-bar-track { flex:1; height:8px; background:var(--border); }
  .score-bar-fill { height:100%; transition: width 1s cubic-bezier(.77,0,.18,1); }
  .score-label { font-family:var(--font-h); font-size:20px; font-weight:700; min-width:52px; text-align:right; }

  .delta { font-size:12px; }
  .delta.up { color:var(--green); }
  .delta.down { color:var(--red); }
  .delta.flat { color:var(--muted); }

  .param-badge {
    background:var(--border); padding:4px 10px;
    font-size:11px; border-radius:2px;
    white-space:nowrap;
  }

  .radar-mini canvas { display:block; }

  @keyframes slideIn {
    from { opacity:0; transform:translateX(-16px); }
    to { opacity:1; transform:translateX(0); }
  }

  .winner-glow { box-shadow: inset 0 0 60px rgba(255,180,0,0.04); }

  /* sparkline */
  .sparkline { display:inline-block; vertical-align:middle; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div>
      <h1>MODEL<br><em>LEADERBOARD</em></h1>
      <div class="hero-sub">ETHAR AI · BENCHMARK SUITE v4.1 · MMLU · HumanEval · HellaSwag · GSM8K</div>
    </div>
    <div class="hero-right">
      <div class="hero-stat">12</div>
      <div class="hero-stat-lbl">Models Evaluated</div>
      <div style="margin-top:16px">
        <div class="hero-stat" style="color:var(--green)">4</div>
        <div class="hero-stat-lbl">New This Week</div>
      </div>
    </div>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active">All Models</button>
  <button class="filter-btn">LLM</button>
  <button class="filter-btn">Vision</button>
  <button class="filter-btn">Multimodal</button>
  <button class="filter-btn">Open Source</button>
</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Model</th>
      <th>Type</th>
      <th>MMLU Score</th>
      <th class="num">HumanEval</th>
      <th class="num">GSM8K</th>
      <th class="num">Params</th>
      <th class="num">Δ Score</th>
      <th>Trend</th>
    </tr>
  </thead>
  <tbody id="leaderBody"></tbody>
</table>
</div>

<script>
const models = [
  {rank:1,name:'GPT-4o',org:'OpenAI',type:'multi',mmlu:88.7,humaneval:90.2,gsm8k:97.0,params:'1.8T*',delta:+2.1,trend:[82,83,85,85,87,88,88.7]},
  {rank:2,name:'Claude 3.5 Sonnet',org:'Anthropic',type:'multi',mmlu:88.3,humaneval:92.0,gsm8k:96.4,params:'~200B',delta:+3.4,trend:[78,81,84,85,87,88,88.3]},
  {rank:3,name:'Gemini 1.5 Pro',org:'Google',type:'multi',mmlu:87.2,humaneval:84.1,gsm8k:94.4,params:'~540B',delta:+1.2,trend:[80,82,83,84,85,86,87.2]},
  {rank:4,name:'Llama 3.1 405B',org:'Meta',type:'llm',mmlu:85.1,humaneval:89.0,gsm8k:96.8,params:'405B',delta:+4.8,trend:[60,65,72,78,80,83,85.1]},
  {rank:5,name:'Mistral Large 2',org:'Mistral AI',type:'llm',mmlu:84.0,humaneval:92.1,gsm8k:93.0,params:'123B',delta:+2.3,trend:[74,76,79,80,82,83,84]},
  {rank:6,name:'Qwen2.5 72B',org:'Alibaba',type:'llm',mmlu:83.3,humaneval:85.0,gsm8k:91.2,params:'72B',delta:+5.1,trend:[58,62,69,74,79,81,83.3]},
  {rank:7,name:'DeepSeek V3',org:'DeepSeek',type:'llm',mmlu:82.6,humaneval:88.5,gsm8k:89.4,params:'671B',delta:+6.2,trend:[55,60,67,73,78,80,82.6]},
  {rank:8,name:'Grok-2',org:'xAI',type:'vision',mmlu:81.3,humaneval:76.0,gsm8k:88.7,params:'~314B*',delta:-0.4,trend:[83,83,82,82,82,81,81.3]},
];

const rankColors = ['gold','silver','bronze','normal','normal','normal','normal','normal'];
const rankLabels = ['1','2','3','4','5','6','7','8'];
const typeMap = {llm:'type-llm',vision:'type-vision',multi:'type-multi'};
const typeLabels = {llm:'LLM',vision:'Vision',multi:'Multimodal'};

const tbody = document.getElementById('leaderBody');
models.forEach((m,i)=>{
  const tr = document.createElement('tr');
  if(i===0) tr.classList.add('winner-glow');
  tr.style.animationDelay = (i*0.06)+'s';

  // sparkline canvas
  const sparkId = 'spark'+i;

  tr.innerHTML = `
    <td><span class="rank ${rankColors[i]}">${rankLabels[i]}</span></td>
    <td>
      <div class="model-name">${m.name}</div>
      <div class="model-org">${m.org}</div>
      <div class="model-type ${typeMap[m.type]}">${typeLabels[m.type]}</div>
    </td>
    <td>
      <div class="score-bar-wrap">
        <div class="score-bar-track"><div class="score-bar-fill" data-w="${(m.mmlu/100*100).toFixed(1)}" style="width:0%;background:${i<3?'#FFB400':i<6?'#4F8EF7':'#5A5A70'}"></div></div>
        <div class="score-label" style="color:${i<3?'#FFB400':i<6?'#4F8EF7':'#A0A0B0'}">${m.mmlu}</div>
      </div>
    </td>
    <td class="num">${m.humaneval}%</td>
    <td class="num">${m.gsm8k}%</td>
    <td class="num"><span class="param-badge">${m.params}</span></td>
    <td class="num">
      <span class="delta ${m.delta>0?'up':m.delta<0?'down':'flat'}">
        ${m.delta>0?'↑':m.delta<0?'↓':'→'} ${Math.abs(m.delta).toFixed(1)}
      </span>
    </td>
    <td><canvas class="sparkline" id="${sparkId}" width="80" height="30"></canvas></td>
  `;
  tbody.appendChild(tr);

  // Draw sparkline after DOM insert
  requestAnimationFrame(()=>{
    const sc = document.getElementById(sparkId);
    if(!sc) return;
    const sctx = sc.getContext('2d');
    const sw=80,sh=30;
    const minV=Math.min(...m.trend), maxV=Math.max(...m.trend);
    const color = m.delta>=0?'#22D46A':'#F23636';
    sctx.strokeStyle=color; sctx.lineWidth=2; sctx.lineJoin='round';
    sctx.shadowColor=color; sctx.shadowBlur=6;
    sctx.beginPath();
    m.trend.forEach((v,j)=>{
      const x=j/(m.trend.length-1)*(sw-4)+2;
      const y=sh-4 - (v-minV)/(maxV-minV+0.001)*(sh-8);
      j===0?sctx.moveTo(x,y):sctx.lineTo(x,y);
    });
    sctx.stroke();
  });
});

setTimeout(()=>{
  document.querySelectorAll('.score-bar-fill').forEach(b=>{ b.style.width=b.dataset.w+'%'; });
},200);

// Filter buttons (visual only)
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
