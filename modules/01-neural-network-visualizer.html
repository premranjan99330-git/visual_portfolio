<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap');
  :root {
    --black: #0a0a0a;
    --red: #ff2d20;
    --yellow: #ffd600;
    --white: #f5f5f0;
    --gray: #1a1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--black); color: var(--white); font-family: 'Space Mono', monospace; overflow-x: hidden; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 24px 48px; border-bottom: 3px solid var(--red);
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 4px; color: var(--red); }
  .tag { font-size: 0.65rem; color: var(--yellow); letter-spacing: 3px; }
  .hero { padding: 60px 48px 20px; }
  .hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 8vw, 7rem); line-height: 0.9; color: var(--white); }
  .hero h1 span { color: var(--red); }
  .hero p { margin-top: 20px; font-size: 0.75rem; color: #888; max-width: 400px; line-height: 1.8; }
  canvas { display: block; margin: 0 auto; }
  .controls {
    display: flex; gap: 16px; padding: 24px 48px; flex-wrap: wrap;
  }
  .ctrl {
    display: flex; flex-direction: column; gap: 6px;
  }
  label { font-size: 0.6rem; color: var(--yellow); letter-spacing: 2px; }
  input[type=range] { width: 140px; accent-color: var(--red); }
  .btn {
    background: var(--red); color: var(--white); border: none;
    font-family: 'Space Mono', monospace; font-size: 0.7rem; letter-spacing: 2px;
    padding: 10px 24px; cursor: pointer; text-transform: uppercase;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--yellow); color: var(--black); }
  .stats {
    display: flex; gap: 40px; padding: 0 48px 40px; border-top: 1px solid #222; margin-top: 24px; padding-top: 24px;
  }
  .stat-item { display: flex; flex-direction: column; gap: 4px; }
  .stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: var(--red); }
  .stat-lbl { font-size: 0.6rem; color: #555; letter-spacing: 2px; }
  .canvas-wrap { padding: 0 48px; position: relative; }
  .canvas-wrap::before {
    content: 'LIVE RENDER';
    position: absolute; top: 12px; right: 60px;
    font-size: 0.55rem; color: var(--red); letter-spacing: 3px;
    animation: blink 1.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
</head>
<body>
<header>
  <div class="logo">ETHAR.AI</div>
  <div class="tag">NEURAL NETWORK VISUALIZER / V1.0</div>
</header>
<div class="hero">
  <h1>DEEP<br><span>NETWORK</span><br>ARCHITECT</h1>
  <p>Interactive visualization of multi-layer perceptron architecture. Adjust layers, nodes, and watch connections animate in real time.</p>
</div>
<div class="controls">
  <div class="ctrl">
    <label>Hidden Layers</label>
    <input type="range" id="layers" min="1" max="6" value="3">
  </div>
  <div class="ctrl">
    <label>Nodes Per Layer</label>
    <input type="range" id="nodes" min="2" max="10" value="5">
  </div>
  <div class="ctrl">
    <label>Input Nodes</label>
    <input type="range" id="inputs" min="1" max="8" value="4">
  </div>
  <div class="ctrl">
    <label>Output Nodes</label>
    <input type="range" id="outputs" min="1" max="6" value="2">
  </div>
  <div class="ctrl" style="justify-content:flex-end">
    <label>&nbsp;</label>
    <button class="btn" id="animBtn">PAUSE</button>
  </div>
</div>
<div class="canvas-wrap">
  <canvas id="canvas" height="420"></canvas>
</div>
<div class="stats">
  <div class="stat-item"><div class="stat-val" id="totalNodes">-</div><div class="stat-lbl">TOTAL NODES</div></div>
  <div class="stat-item"><div class="stat-val" id="totalWeights">-</div><div class="stat-lbl">WEIGHTS</div></div>
  <div class="stat-item"><div class="stat-val" id="totalLayers">-</div><div class="stat-lbl">TOTAL LAYERS</div></div>
  <div class="stat-item"><div class="stat-val" id="depth">-</div><div class="stat-lbl">DEPTH RATIO</div></div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let animating = true, t = 0;
function getParams() {
  return {
    layers: +document.getElementById('layers').value,
    nodes: +document.getElementById('nodes').value,
    inputs: +document.getElementById('inputs').value,
    outputs: +document.getElementById('outputs').value
  };
}
function buildArch(p) {
  const arch = [p.inputs];
  for (let i = 0; i < p.layers; i++) arch.push(p.nodes);
  arch.push(p.outputs);
  return arch;
}
function draw() {
  const W = canvas.parentElement.clientWidth - 96;
  canvas.width = W;
  const p = getParams();
  const arch = buildArch(p);
  ctx.clearRect(0, 0, W, 420);
  const pad = 60, H = 420;
  const colW = (W - pad * 2) / (arch.length - 1);
  const positions = arch.map((n, li) => {
    const x = pad + li * colW;
    return Array.from({length: n}, (_, ni) => ({
      x, y: H/2 + (ni - (n-1)/2) * Math.min(60, (H-80)/Math.max(n,1))
    }));
  });
  // Draw connections
  for (let li = 0; li < positions.length - 1; li++) {
    for (const a of positions[li]) {
      for (const b of positions[li+1]) {
        const phase = Math.sin(t * 0.03 + a.x * 0.01 + b.y * 0.01);
        const alpha = 0.08 + 0.18 * Math.abs(phase);
        const isActive = Math.abs(phase) > 0.6;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = isActive ? `rgba(255,45,32,${alpha * 2})` : `rgba(245,245,240,${alpha})`;
        ctx.lineWidth = isActive ? 1.5 : 0.5;
        ctx.stroke();
      }
    }
  }
  // Draw nodes
  positions.forEach((layer, li) => {
    const isInput = li === 0, isOutput = li === positions.length - 1;
    layer.forEach(n => {
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.05 + n.x * 0.02 + n.y * 0.02);
      const r = isInput || isOutput ? 12 : 8 + pulse * 3;
      const col = isInput ? '#ffd600' : isOutput ? '#ff2d20' : `rgba(245,245,240,${0.4 + pulse * 0.6})`;
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2);
      ctx.fillStyle = col; ctx.fill();
      if (isInput || isOutput) {
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 4, 0, Math.PI*2);
        ctx.strokeStyle = isInput ? 'rgba(255,214,0,0.3)' : 'rgba(255,45,32,0.3)';
        ctx.lineWidth = 2; ctx.stroke();
      }
    });
  });
  // Labels
  ctx.font = '9px Space Mono'; ctx.fillStyle = '#555'; ctx.textAlign = 'center';
  const labels = ['INPUT', ...Array.from({length: p.layers}, (_,i)=>`H${i+1}`), 'OUTPUT'];
  positions.forEach((layer, li) => {
    ctx.fillText(labels[li], layer[0].x, H - 8);
  });
  // Update stats
  let weights = 0;
  for (let i = 0; i < arch.length - 1; i++) weights += arch[i] * arch[i+1];
  const totalNodes = arch.reduce((a,b)=>a+b,0);
  document.getElementById('totalNodes').textContent = totalNodes;
  document.getElementById('totalWeights').textContent = weights;
  document.getElementById('totalLayers').textContent = arch.length;
  document.getElementById('depth').textContent = (p.layers / p.nodes).toFixed(2);
}
function loop() { if (animating) t++; draw(); requestAnimationFrame(loop); }
document.getElementById('animBtn').addEventListener('click', function() {
  animating = !animating; this.textContent = animating ? 'PAUSE' : 'PLAY';
});
document.querySelectorAll('input[type=range]').forEach(el => el.addEventListener('input', draw));
window.addEventListener('resize', draw);
loop();
</script>
</body>
</html>
