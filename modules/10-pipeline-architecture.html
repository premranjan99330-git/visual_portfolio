<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Pipeline Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Fira+Code:wght@400;500&display=swap');
  :root{--bg:#0b0c10;--s1:#16213e;--s2:#0f3460;--a:#e94560;--b:#533483;--c:#0f7173;--text:#c7d3d4;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Fira Code',monospace;min-height:100vh;}
  .hdr{padding:16px 40px;border-bottom:1px solid #1a1f35;display:flex;justify-content:space-between;align-items:center;}
  .brand{font-family:'Rajdhani',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:4px;color:var(--a);}
  .version{font-size:0.55rem;color:#445;letter-spacing:2px;}
  .legend{display:flex;gap:20px;padding:12px 40px;border-bottom:1px solid #1a1f35;flex-wrap:wrap;}
  .leg{display:flex;align-items:center;gap:6px;font-size:0.55rem;color:#888;}
  .leg-box{width:14px;height:14px;border:1.5px solid;}
  .diagram{padding:30px 40px;overflow-x:auto;}
  svg{display:block;margin:0 auto;}
  .node{cursor:pointer;}
  .node rect{transition:filter 0.2s;}
  .node:hover rect{filter:brightness(1.3);}
  .tooltip{position:fixed;background:#16213e;border:1px solid var(--a);padding:10px 14px;font-size:0.6rem;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:100;max-width:200px;line-height:1.6;}
  .status-bar{display:flex;gap:20px;padding:14px 40px;border-top:1px solid #1a1f35;flex-wrap:wrap;}
  .status{display:flex;align-items:center;gap:6px;font-size:0.55rem;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .dot.ok{background:#0f7173;animation:pulse2 2s infinite;}
  .dot.warn{background:#e9a84e;}
  .dot.err{background:var(--a);}
  @keyframes pulse2{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div class="hdr">
  <div class="brand">AI PIPELINE ARCHITECT</div>
  <div class="version">ETHAR.AI / ML OPS / SYSTEM DESIGN</div>
</div>
<div class="legend">
  <div class="leg"><div class="leg-box" style="border-color:#0f7173;background:#0f717330"></div>Data Layer</div>
  <div class="leg"><div class="leg-box" style="border-color:#533483;background:#53348330"></div>Processing</div>
  <div class="leg"><div class="leg-box" style="border-color:#e94560;background:#e9456030"></div>Model Layer</div>
  <div class="leg"><div class="leg-box" style="border-color:#0f3460;background:#0f346080"></div>Serving</div>
  <div class="leg"><div class="leg-box" style="border-color:#888;background:#33333340"></div>Storage</div>
</div>
<div class="diagram">
<svg width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#445"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e94560"/>
    </marker>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background sections -->
  <rect x="10" y="30" width="150" height="460" rx="4" fill="#0f7173" opacity="0.06"/>
  <rect x="180" y="30" width="160" height="460" rx="4" fill="#533483" opacity="0.06"/>
  <rect x="360" y="30" width="180" height="460" rx="4" fill="#e94560" opacity="0.06"/>
  <rect x="560" y="30" width="160" height="460" rx="4" fill="#0f3460" opacity="0.08"/>
  <rect x="740" y="30" width="150" height="460" rx="4" fill="#333" opacity="0.08"/>
  <text x="85" y="22" text-anchor="middle" fill="#0f7173" font-family="Fira Code" font-size="9" letter-spacing="2">DATA LAYER</text>
  <text x="260" y="22" text-anchor="middle" fill="#533483" font-family="Fira Code" font-size="9" letter-spacing="2">PROCESSING</text>
  <text x="450" y="22" text-anchor="middle" fill="#e94560" font-family="Fira Code" font-size="9" letter-spacing="2">MODEL LAYER</text>
  <text x="640" y="22" text-anchor="middle" fill="#89a0b0" font-family="Fira Code" font-size="9" letter-spacing="2">SERVING</text>
  <text x="815" y="22" text-anchor="middle" fill="#aaa" font-family="Fira Code" font-size="9" letter-spacing="2">STORAGE</text>

  <!-- DATA SOURCES -->
  <g class="node" onclick="showTip(event,'Raw Streams','Kafka topics ingesting CSV, JSON, Parquet from 12 upstream sources. 2M events/day.')">
    <rect x="20" y="60" width="130" height="44" rx="3" fill="#0f717320" stroke="#0f7173" stroke-width="1.5"/>
    <text x="85" y="78" text-anchor="middle" fill="#4dd0e1" font-family="Fira Code" font-size="9" font-weight="500">RAW STREAMS</text>
    <text x="85" y="93" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">Kafka / 2M evt/day</text>
  </g>
  <g class="node" onclick="showTip(event,'Batch Files','S3-hosted CSV/Parquet. Nightly batch jobs. 500GB total data.')">
    <rect x="20" y="130" width="130" height="44" rx="3" fill="#0f717320" stroke="#0f7173" stroke-width="1.5"/>
    <text x="85" y="148" text-anchor="middle" fill="#4dd0e1" font-family="Fira Code" font-size="9">BATCH FILES</text>
    <text x="85" y="163" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">S3 / CSV / Parquet</text>
  </g>
  <g class="node" onclick="showTip(event,'Database','PostgreSQL + MongoDB. Transactional + document store. 10TB.')">
    <rect x="20" y="200" width="130" height="44" rx="3" fill="#0f717320" stroke="#0f7173" stroke-width="1.5"/>
    <text x="85" y="218" text-anchor="middle" fill="#4dd0e1" font-family="Fira Code" font-size="9">DATABASE</text>
    <text x="85" y="233" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">Postgres / Mongo</text>
  </g>
  <g class="node" onclick="showTip(event,'API Sources','REST & GraphQL endpoints. 3rd-party integrations. Rate-limited at 10k req/hr.')">
    <rect x="20" y="270" width="130" height="44" rx="3" fill="#0f717320" stroke="#0f7173" stroke-width="1.5"/>
    <text x="85" y="288" text-anchor="middle" fill="#4dd0e1" font-family="Fira Code" font-size="9">API SOURCES</text>
    <text x="85" y="303" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">REST / GraphQL</text>
  </g>

  <!-- ARROWS to ETL -->
  <line x1="150" y1="82" x2="186" y2="180" stroke="#445" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="150" y1="152" x2="186" y2="185" stroke="#445" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="150" y1="222" x2="186" y2="195" stroke="#445" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="150" y1="292" x2="186" y2="200" stroke="#445" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ETL / PREPROCESSING -->
  <g class="node" onclick="showTip(event,'ETL Pipeline','Apache Spark. Schema validation, deduplication, join logic. 30-min SLA.')">
    <rect x="186" y="155" width="140" height="52" rx="3" fill="#53348320" stroke="#533483" stroke-width="2"/>
    <text x="256" y="176" text-anchor="middle" fill="#ce93d8" font-family="Fira Code" font-size="9" font-weight="500">ETL PIPELINE</text>
    <text x="256" y="192" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">Spark / 30-min SLA</text>
  </g>
  <g class="node" onclick="showTip(event,'Feature Engineering','160+ engineered features. One-hot, embeddings, scaling, PCA, lag features.')">
    <rect x="186" y="240" width="140" height="52" rx="3" fill="#53348320" stroke="#533483" stroke-width="2"/>
    <text x="256" y="260" text-anchor="middle" fill="#ce93d8" font-family="Fira Code" font-size="9">FEATURE ENG.</text>
    <text x="256" y="276" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">160+ features</text>
  </g>
  <g class="node" onclick="showTip(event,'Feature Store','Feast feature store. Online (Redis) + offline (Parquet) stores.')">
    <rect x="186" y="330" width="140" height="44" rx="3" fill="#53348320" stroke="#533483" stroke-width="1.5"/>
    <text x="256" y="348" text-anchor="middle" fill="#ce93d8" font-family="Fira Code" font-size="9">FEATURE STORE</text>
    <text x="256" y="363" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">Feast / Redis</text>
  </g>
  <line x1="256" y1="207" x2="256" y2="240" stroke="#533483" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="256" y1="292" x2="256" y2="330" stroke="#533483" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ARROWS to model -->
  <line x1="326" y1="181" x2="366" y2="220" stroke="#533483" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="326" y1="266" x2="366" y2="250" stroke="#533483" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="326" y1="352" x2="366" y2="280" stroke="#533483" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MODEL LAYER -->
  <g class="node" onclick="showTip(event,'Experiment Tracking','MLflow. 240+ experiments logged. Hyperparameter search with Optuna.')">
    <rect x="366" y="60" width="164" height="44" rx="3" fill="#e9456020" stroke="#e94560" stroke-width="2"/>
    <text x="448" y="78" text-anchor="middle" fill="#ef9a9a" font-family="Fira Code" font-size="9">EXPERIMENT TRACKING</text>
    <text x="448" y="93" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">MLflow / Optuna</text>
  </g>
  <g class="node" filter="url(#glow)" onclick="showTip(event,'Champion Model','XGBoost ensemble. AUC 0.989, MAPE 2.4%. Retrained weekly.')">
    <rect x="366" y="195" width="164" height="52" rx="3" fill="#e9456030" stroke="#e94560" stroke-width="2.5"/>
    <text x="448" y="217" text-anchor="middle" fill="#f48fb1" font-family="Fira Code" font-size="9" font-weight="500">CHAMPION MODEL</text>
    <text x="448" y="233" text-anchor="middle" fill="#f06292" font-family="Fira Code" font-size="7">XGBoost / AUC=0.989</text>
  </g>
  <g class="node" onclick="showTip(event,'Challenger Model','Neural net candidate. Shadow mode. Promoted when beats champion for 7 days.')">
    <rect x="366" y="280" width="164" height="44" rx="3" fill="#e9456015" stroke="#e94560" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="448" y="298" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="9">CHALLENGER MODEL</text>
    <text x="448" y="313" text-anchor="middle" fill="#555" font-family="Fira Code" font-size="7">Neural Net / shadow mode</text>
  </g>
  <g class="node" onclick="showTip(event,'Model Registry','MLflow registry. Staging → Production workflow. Auto rollback on perf drop.')">
    <rect x="366" y="360" width="164" height="44" rx="3" fill="#e9456020" stroke="#e94560" stroke-width="1.5"/>
    <text x="448" y="378" text-anchor="middle" fill="#ef9a9a" font-family="Fira Code" font-size="9">MODEL REGISTRY</text>
    <text x="448" y="393" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">MLflow / Staging→Prod</text>
  </g>
  <line x1="448" y1="104" x2="448" y2="195" stroke="#e94560" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="448" y1="247" x2="448" y2="280" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="448" y1="324" x2="448" y2="360" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ARROW to serving -->
  <line x1="530" y1="221" x2="566" y2="180" stroke="#e94560" stroke-width="2" marker-end="url(#arr-a)"/>
  <line x1="530" y1="382" x2="566" y2="340" stroke="#e94560" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SERVING -->
  <g class="node" onclick="showTip(event,'REST API','FastAPI. 99.9% uptime SLA. Auto-scaling. JWT auth. &lt;10ms P99 latency.')">
    <rect x="566" y="140" width="144" height="52" rx="3" fill="#0f346050" stroke="#4a90d9" stroke-width="2"/>
    <text x="638" y="162" text-anchor="middle" fill="#90caf9" font-family="Fira Code" font-size="9" font-weight="500">REST API</text>
    <text x="638" y="178" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">FastAPI / &lt;10ms P99</text>
  </g>
  <g class="node" onclick="showTip(event,'Batch Scoring','Airflow DAGs. Nightly scoring of full dataset. Results → S3.')">
    <rect x="566" y="220" width="144" height="44" rx="3" fill="#0f346030" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="638" y="238" text-anchor="middle" fill="#90caf9" font-family="Fira Code" font-size="9">BATCH SCORING</text>
    <text x="638" y="253" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">Airflow / nightly</text>
  </g>
  <g class="node" onclick="showTip(event,'Monitoring','Evidently AI + Grafana. Drift detection, accuracy tracking, alerting.')">
    <rect x="566" y="300" width="144" height="52" rx="3" fill="#0f346030" stroke="#4a90d9" stroke-width="1.5"/>
    <text x="638" y="320" text-anchor="middle" fill="#90caf9" font-family="Fira Code" font-size="9">MONITORING</text>
    <text x="638" y="336" text-anchor="middle" fill="#888" font-family="Fira Code" font-size="7">Evidently / Grafana</text>
  </g>
  <line x1="638" y1="192" x2="638" y2="220" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="638" y1="264" x2="638" y2="300" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STORAGE -->
  <g class="node" onclick="showTip(event,'Model Store','S3 + versioned. All model artifacts, configs, preprocessors.')">
    <rect x="750" y="140" width="130" height="44" rx="3" fill="#33333340" stroke="#666" stroke-width="1.5"/>
    <text x="815" y="158" text-anchor="middle" fill="#aaa" font-family="Fira Code" font-size="9">MODEL STORE</text>
    <text x="815" y="173" text-anchor="middle" fill="#555" font-family="Fira Code" font-size="7">S3 / versioned</text>
  </g>
  <g class="node" onclick="showTip(event,'Predictions DB','PostgreSQL. All predictions with confidence scores, timestamps, metadata.')">
    <rect x="750" y="220" width="130" height="44" rx="3" fill="#33333340" stroke="#666" stroke-width="1.5"/>
    <text x="815" y="238" text-anchor="middle" fill="#aaa" font-family="Fira Code" font-size="9">PREDICTIONS DB</text>
    <text x="815" y="253" text-anchor="middle" fill="#555" font-family="Fira Code" font-size="7">PostgreSQL</text>
  </g>
  <g class="node" onclick="showTip(event,'Data Warehouse','Snowflake. All processed features, audit logs, performance metrics.')">
    <rect x="750" y="300" width="130" height="44" rx="3" fill="#33333340" stroke="#666" stroke-width="1.5"/>
    <text x="815" y="318" text-anchor="middle" fill="#aaa" font-family="Fira Code" font-size="9">DATA WAREHOUSE</text>
    <text x="815" y="333" text-anchor="middle" fill="#555" font-family="Fira Code" font-size="7">Snowflake</text>
  </g>
  <line x1="710" y1="162" x2="750" y2="162" stroke="#445" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="710" y1="242" x2="750" y2="242" stroke="#445" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="710" y1="326" x2="750" y2="326" stroke="#445" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Feedback loop -->
  <path d="M815 380 Q815 460 448 460 Q200 460 200 400" fill="none" stroke="#e94560" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-a)"/>
  <text x="500" y="472" text-anchor="middle" fill="#e94560" font-family="Fira Code" font-size="8" letter-spacing="1">← RETRAINING FEEDBACK LOOP</text>
</svg>
</div>
<div class="status-bar">
  <div class="status"><div class="dot ok"></div><span>Data ingestion: ACTIVE</span></div>
  <div class="status"><div class="dot ok"></div><span>Champion model: SERVING</span></div>
  <div class="status"><div class="dot ok"></div><span>API: 99.97% uptime</span></div>
  <div class="status"><div class="dot warn"></div><span>Challenger: shadow mode</span></div>
  <div class="status"><div class="dot ok"></div><span>Monitoring: HEALTHY</span></div>
  <div class="status" style="margin-left:auto"><span style="font-size:0.55rem;color:#444">Click any node for details</span></div>
</div>
<div class="tooltip" id="tip"></div>
<script>
function showTip(e,title,desc){
  const tip=document.getElementById('tip');
  tip.innerHTML=`<strong style="color:#e94560">${title}</strong><br>${desc}`;
  tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY-10)+'px';
  tip.style.opacity=1;
  setTimeout(()=>tip.style.opacity=0,3000);
}
</script>
</body>
</html>
