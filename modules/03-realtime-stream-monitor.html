<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Data Stream Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Bebas+Neue&display=swap');
  :root{--bg:#050a0e;--panel:#0d1821;--border:#1a2b3c;--green:#00ff88;--orange:#ff6b35;--blue:#4cc9f0;--red:#ff2d55;--text:#c8d8e4;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;}
  .hdr{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid var(--border);}
  .hdr-left{display:flex;align-items:center;gap:16px;}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:4px;color:var(--green);}
  .live-badge{display:flex;align-items:center;gap:6px;font-size:0.6rem;color:var(--red);letter-spacing:2px;}
  .pulse{width:8px;height:8px;background:var(--red);border-radius:50%;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,85,0.6)}50%{box-shadow:0 0 0 6px rgba(255,45,85,0)}}
  .hdr-right{font-size:0.6rem;color:#3a5068;letter-spacing:2px;}
  #clock{color:var(--blue);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);}
  .kpi{background:var(--panel);padding:20px 24px;}
  .kpi-label{font-size:0.55rem;letter-spacing:3px;color:#3a5068;margin-bottom:6px;}
  .kpi-val{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;transition:color 0.3s;}
  .kpi-delta{font-size:0.6rem;margin-top:4px;}
  .up{color:var(--green);}
  .dn{color:var(--red);}
  .nt{color:var(--orange);}
  .streams{display:grid;grid-template-columns:2fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-top:none;}
  .panel{background:var(--panel);padding:24px;}
  .panel-title{font-size:0.6rem;letter-spacing:3px;color:#3a5068;margin-bottom:16px;display:flex;justify-content:space-between;}
  .panel-title span{color:var(--green);}
  canvas{display:block;width:100%;}
  .log{height:260px;overflow-y:auto;display:flex;flex-direction:column-reverse;}
  .log-entry{font-size:0.58rem;padding:5px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;animation:fadein 0.3s;}
  @keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
  .log-time{color:#3a5068;white-space:nowrap;}
  .log-src{color:var(--blue);width:80px;}
  .log-msg{color:var(--text);}
  .log-sev{font-size:0.5rem;padding:1px 5px;}
  .sev-ok{background:rgba(0,255,136,0.15);color:var(--green);}
  .sev-warn{background:rgba(255,107,53,0.15);color:var(--orange);}
  .sev-err{background:rgba(255,45,85,0.15);color:var(--red);}
  .mini-charts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-top:none;}
  .mini{background:var(--panel);padding:16px;}
  .mini-title{font-size:0.55rem;letter-spacing:2px;color:#3a5068;margin-bottom:10px;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <div class="brand">STREAM.MONITOR</div>
    <div class="live-badge"><div class="pulse"></div>LIVE</div>
  </div>
  <div class="hdr-right">ETHAR.AI / <span id="clock">--:--:--</span></div>
</div>
<div class="grid">
  <div class="kpi"><div class="kpi-label">EVENTS/SEC</div><div class="kpi-val up" id="k1">0</div><div class="kpi-delta up" id="d1">--</div></div>
  <div class="kpi"><div class="kpi-label">MODEL LATENCY</div><div class="kpi-val nt" id="k2">0ms</div><div class="kpi-delta" id="d2">--</div></div>
  <div class="kpi"><div class="kpi-label">ACCURACY LIVE</div><div class="kpi-val up" id="k3">--%</div><div class="kpi-delta up" id="d3">--</div></div>
  <div class="kpi"><div class="kpi-label">ALERTS</div><div class="kpi-val dn" id="k4">0</div><div class="kpi-delta dn" id="d4">--</div></div>
</div>
<div class="streams">
  <div class="panel">
    <div class="panel-title">EVENT STREAM RATE <span id="rate-val">-- evt/s</span></div>
    <canvas id="streamCanvas" height="240"></canvas>
  </div>
  <div class="panel">
    <div class="panel-title">SYSTEM LOG <span>LIVE</span></div>
    <div class="log" id="log"></div>
  </div>
</div>
<div class="mini-charts">
  <div class="mini"><div class="mini-title">MODEL CONFIDENCE DISTRIBUTION</div><canvas id="hist" height="120"></canvas></div>
  <div class="mini"><div class="mini-title">LATENCY HEATMAP (LAST 60s)</div><canvas id="heat" height="120"></canvas></div>
</div>
<script>
const streamCanvas = document.getElementById('streamCanvas');
const sctx = streamCanvas.getContext('2d');
const histCanvas = document.getElementById('hist');
const hctx = histCanvas.getContext('2d');
const heatCanvas = document.getElementById('heat');
const htx = heatCanvas.getContext('2d');
let streamData=[], latencies=[], alerts=0, tick=0;
const COLORS={green:'#00ff88',orange:'#ff6b35',blue:'#4cc9f0',red:'#ff2d55'};
const sources=['MODEL-A','PIPELINE','INGEST','VALIDATOR','ROUTER'];
const msgs={ok:['inference complete','batch processed','stream synced','checkpoint saved'],warn:['high memory usage','batch delayed','slow inference'],err:['stream timeout','model error','pipeline stall']};
function fmt(d){return d.toLocaleTimeString('en',{hour12:false});}
function addLog(sev){
  const src=sources[Math.floor(Math.random()*sources.length)];
  const pool=msgs[sev]; const msg=pool[Math.floor(Math.random()*pool.length)];
  const entry=document.createElement('div'); entry.className='log-entry';
  entry.innerHTML=`<span class="log-time">${fmt(new Date())}</span><span class="log-src">${src}</span><span class="log-msg">${msg}</span><span class="log-sev sev-${sev}">${sev.toUpperCase()}</span>`;
  const log=document.getElementById('log');
  log.insertBefore(entry,log.firstChild);
  if(log.children.length>40) log.removeChild(log.lastChild);
}
function drawStream(){
  const W=streamCanvas.parentElement.clientWidth-48;
  streamCanvas.width=W; streamCanvas.height=240;
  sctx.clearRect(0,0,W,240);
  if(streamData.length<2)return;
  const max=Math.max(...streamData,100);
  // Grid
  sctx.strokeStyle='#0d1821'; sctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=i*60;
    sctx.beginPath(); sctx.moveTo(0,y); sctx.lineTo(W,y); sctx.stroke();
    sctx.font='8px IBM Plex Mono'; sctx.fillStyle='#3a5068'; sctx.textAlign='right';
    sctx.fillText(Math.round(max*(1-i/4)),32,y+3);
  }
  // Area
  sctx.beginPath(); sctx.moveTo(0,240);
  streamData.forEach((v,i)=>{
    const x=i/(streamData.length-1)*W;
    const y=240-v/max*220;
    i===0?sctx.moveTo(x,y):sctx.lineTo(x,y);
  });
  sctx.lineTo(W,240); sctx.lineTo(0,240);
  const grad=sctx.createLinearGradient(0,0,0,240);
  grad.addColorStop(0,'rgba(0,255,136,0.3)'); grad.addColorStop(1,'rgba(0,255,136,0)');
  sctx.fillStyle=grad; sctx.fill();
  // Line
  sctx.beginPath(); sctx.strokeStyle=COLORS.green; sctx.lineWidth=2;
  streamData.forEach((v,i)=>{
    const x=i/(streamData.length-1)*W;
    const y=240-v/max*220;
    i===0?sctx.moveTo(x,y):sctx.lineTo(x,y);
  });
  sctx.stroke();
}
function drawHist(){
  histCanvas.width=histCanvas.parentElement.clientWidth-32;
  histCanvas.height=120;
  hctx.clearRect(0,0,histCanvas.width,120);
  const bins=10; const W=histCanvas.width; const bW=(W-40)/bins;
  const data=Array.from({length:bins},(_,i)=>Math.round(5+Math.random()*40+(i<bins/2?-i*2:i*3)));
  const maxV=Math.max(...data);
  data.forEach((v,i)=>{
    const x=40+i*bW; const h=v/maxV*90;
    const hue=i/bins;
    hctx.fillStyle=`hsl(${120+hue*60},80%,55%)`;
    hctx.fillRect(x,120-h,bW-2,h);
    hctx.font='7px IBM Plex Mono'; hctx.fillStyle='#3a5068'; hctx.textAlign='center';
    hctx.fillText(((i+1)*10)+'%',x+bW/2,118);
  });
}
function drawHeat(){
  heatCanvas.width=heatCanvas.parentElement.clientWidth-32;
  heatCanvas.height=120;
  htx.clearRect(0,0,heatCanvas.width,120);
  const cols=60,rows=5,W=heatCanvas.width,H=120;
  const cW=(W-40)/cols,rH=(H-20)/rows;
  for(let r=0;r<rows;r++){
    htx.font='7px IBM Plex Mono'; htx.fillStyle='#3a5068'; htx.textAlign='right';
    htx.fillText([5,10,20,50,100][r]+'ms',36,r*rH+rH/2+3);
    for(let c=0;c<cols;c++){
      const v=Math.random();
      const intense=v>0.7?v:v*0.4;
      htx.fillStyle=`rgba(255,107,53,${intense})`;
      htx.fillRect(40+c*cW,r*rH,cW-1,rH-1);
    }
  }
}
let prevEvt=0;
function update(){
  tick++;
  const now=new Date();
  document.getElementById('clock').textContent=fmt(now);
  const evt=Math.round(200+Math.sin(tick*0.1)*80+Math.random()*60);
  const lat=Math.round(20+Math.cos(tick*0.08)*8+Math.random()*15);
  const acc=(94+Math.sin(tick*0.05)*2.5+Math.random()).toFixed(1);
  streamData.push(evt); if(streamData.length>80) streamData.shift();
  const dEvt=evt-prevEvt;
  document.getElementById('k1').textContent=evt;
  document.getElementById('d1').textContent=(dEvt>=0?'↑':'↓')+Math.abs(dEvt)+' vs prev';
  document.getElementById('d1').className='kpi-delta '+(dEvt>=0?'up':'dn');
  document.getElementById('k2').textContent=lat+'ms';
  document.getElementById('k2').className='kpi-val '+(lat<30?'up':lat<45?'nt':'dn');
  document.getElementById('d2').textContent=lat<30?'NOMINAL':lat<45?'ELEVATED':'HIGH';
  document.getElementById('k3').textContent=acc+'%';
  document.getElementById('d3').textContent='TARGET: 95.0%';
  if(Math.random()<0.06){alerts++;document.getElementById('k4').textContent=alerts;addLog('err');}
  else if(Math.random()<0.15){addLog('warn');}
  else{addLog('ok');}
  document.getElementById('rate-val').textContent=evt+' evt/s';
  prevEvt=evt;
  drawStream(); if(tick%5===0)drawHist(); if(tick%3===0)drawHeat();
}
drawHist(); drawHeat(); setInterval(update,800);
</script>
</body>
</html>
