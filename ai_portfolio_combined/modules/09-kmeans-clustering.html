<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Means Clustering Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;700&family=Secular+One&display=swap');
  :root{--bg:#fff8f0;--ink:#1a0500;--a:#d84315;--b:#0277bd;--c:#558b2f;--d:#6a1b9a;--e:#00695c;--border:#e0d0c0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);font-family:'Azeret Mono',monospace;color:var(--ink);}
  .hdr{background:var(--ink);padding:16px 36px;display:flex;justify-content:space-between;align-items:center;}
  .brand{font-family:'Secular One',sans-serif;font-size:1.4rem;letter-spacing:3px;color:#fff8f0;}
  .brand em{color:#ff5722;font-style:normal;}
  .sub{font-size:0.55rem;color:#888;letter-spacing:2px;}
  .controls{display:flex;gap:12px;padding:14px 36px;border-bottom:2px solid var(--ink);flex-wrap:wrap;align-items:center;}
  .ctrllbl{font-size:0.55rem;letter-spacing:2px;color:#888;}
  input[type=range]{accent-color:var(--a);width:100px;}
  .btn{background:var(--a);color:#fff;border:none;font-family:'Azeret Mono',monospace;font-size:0.65rem;padding:8px 20px;cursor:pointer;letter-spacing:1px;}
  .btn:hover{background:#bf360c;}
  .btn.sec{background:transparent;border:2px solid var(--ink);color:var(--ink);}
  .btn.sec:hover{background:var(--ink);color:#fff8f0;}
  .main{display:grid;grid-template-columns:2fr 1fr;gap:0;border-left:2px solid var(--ink);}
  .canvas-wrap{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:20px;position:relative;}
  .side{display:flex;flex-direction:column;border-bottom:2px solid var(--ink);}
  .side-panel{border-bottom:2px solid var(--ink);padding:16px;}
  .side-panel:last-child{border-bottom:none;}
  .sp-title{font-family:'Secular One',sans-serif;font-size:0.8rem;letter-spacing:2px;margin-bottom:12px;}
  .cluster-card{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px;border:1.5px solid var(--border);}
  .cluster-dot{width:14px;height:14px;border-radius:50%;}
  .cluster-info{flex:1;font-size:0.6rem;}
  .cluster-n{font-family:'Secular One',sans-serif;font-size:1.2rem;}
  .metric-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:0.6rem;}
  .metric-item:last-child{border:none;}
  .metric-v{font-family:'Secular One',sans-serif;font-size:1rem;color:var(--a);}
  .iter-info{font-size:0.6rem;color:#888;margin-top:8px;}
  .elbow-wrap{padding:4px;}
  canvas{display:block;}
</style>
</head>
<body>
<div class="hdr">
  <div class="brand"><em>K-MEANS</em> CLUSTERING VISUALIZER</div>
  <div class="sub">ETHAR.AI / UNSUPERVISED LEARNING</div>
</div>
<div class="controls">
  <span class="ctrllbl">K (CLUSTERS):</span>
  <input type="range" id="kSlider" min="2" max="7" value="4">
  <span id="kVal" style="font-size:0.7rem;font-family:Secular One,sans-serif;min-width:16px">4</span>
  <span class="ctrllbl">POINTS:</span>
  <input type="range" id="nSlider" min="50" max="500" value="200">
  <span id="nVal" style="font-size:0.7rem;font-family:Secular One,sans-serif;min-width:30px">200</span>
  <span class="ctrllbl">DISTRIBUTION:</span>
  <select id="distSel" style="background:#fff;border:1.5px solid var(--ink);font-family:Azeret Mono,monospace;font-size:0.6rem;padding:5px">
    <option value="gaussian">Gaussian Blobs</option>
    <option value="ring">Ring</option>
    <option value="moon">Half-Moon</option>
    <option value="uniform">Uniform</option>
  </select>
  <button class="btn" onclick="runClustering()">▶ RUN K-MEANS</button>
  <button class="btn sec" onclick="generateData()">REGENERATE DATA</button>
</div>
<div class="main">
  <div class="canvas-wrap">
    <canvas id="mainC" height="420" style="width:100%"></canvas>
  </div>
  <div class="side">
    <div class="side-panel">
      <div class="sp-title">CLUSTER STATS</div>
      <div id="clusterCards"></div>
    </div>
    <div class="side-panel">
      <div class="sp-title">METRICS</div>
      <div class="metric-item"><span>INERTIA</span><div class="metric-v" id="mInertia">—</div></div>
      <div class="metric-item"><span>SILHOUETTE</span><div class="metric-v" id="mSil">—</div></div>
      <div class="metric-item"><span>ITERATIONS</span><div class="metric-v" id="mIter">—</div></div>
      <div class="metric-item"><span>CONVERGED</span><div class="metric-v" id="mConv" style="color:#558b2f">—</div></div>
    </div>
    <div class="side-panel">
      <div class="sp-title">ELBOW CURVE</div>
      <canvas id="elbowC" height="110" style="width:100%"></canvas>
    </div>
  </div>
</div>
<script>
const COLORS=['#d84315','#0277bd','#558b2f','#6a1b9a','#00695c','#e65100','#283593'];
let data=[], centroids=[], labels=[];
function rnd(a,b){return a+(b-a)*Math.random();}
function generateData(){
  const n=+document.getElementById('nSlider').value;
  const dist=document.getElementById('distSel').value;
  data=[];
  if(dist==='gaussian'){
    const k=+document.getElementById('kSlider').value;
    const centers=Array.from({length:k},()=>({x:rnd(0.15,0.85),y:rnd(0.15,0.85)}));
    for(let i=0;i<n;i++){
      const c=centers[i%k];
      data.push({x:c.x+rnd(-0.12,0.12),y:c.y+rnd(-0.12,0.12)});
    }
  } else if(dist==='ring'){
    for(let i=0;i<n;i++){
      const r=i<n*0.5?0.35:0.2;
      const a=Math.random()*Math.PI*2;
      data.push({x:0.5+r*Math.cos(a)+rnd(-0.03,0.03),y:0.5+r*Math.sin(a)+rnd(-0.03,0.03)});
    }
  } else if(dist==='moon'){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI;
      const r=i<n/2?1:-1;
      data.push({x:0.5+0.35*Math.cos(a)+0.25*r+rnd(-0.03,0.03),y:0.5+0.35*Math.sin(a)+rnd(-0.03,0.03)});
    }
  } else {
    for(let i=0;i<n;i++)data.push({x:rnd(0.05,0.95),y:rnd(0.05,0.95)});
  }
  labels=new Array(data.length).fill(-1);
  centroids=[];
  drawMain();
  drawElbow();
}
function dist2(a,b){return (a.x-b.x)**2+(a.y-b.y)**2;}
function runClustering(){
  const k=+document.getElementById('kSlider').value;
  // Init centroids - K-Means++ style
  centroids=[data[Math.floor(Math.random()*data.length)]];
  for(let i=1;i<k;i++){
    const dists=data.map(p=>Math.min(...centroids.map(c=>dist2(p,c))));
    const total=dists.reduce((a,b)=>a+b,0);
    let r=Math.random()*total;
    for(let j=0;j<data.length;j++){r-=dists[j];if(r<=0){centroids.push(data[j]);break;}}
  }
  let iters=0, changed=true;
  while(changed&&iters<100){
    changed=false; iters++;
    // Assign
    data.forEach((p,i)=>{
      const newLabel=centroids.reduce((best,c,ci)=>dist2(p,c)<dist2(p,centroids[best])?ci:best,0);
      if(newLabel!==labels[i]){labels[i]=newLabel;changed=true;}
    });
    // Update centroids
    centroids=centroids.map((_,ci)=>{
      const pts=data.filter((_,i)=>labels[i]===ci);
      if(!pts.length)return centroids[ci];
      return{x:pts.reduce((s,p)=>s+p.x,0)/pts.length,y:pts.reduce((s,p)=>s+p.y,0)/pts.length};
    });
  }
  // Compute inertia
  const inertia=data.reduce((s,p,i)=>s+dist2(p,centroids[labels[i]]),0);
  document.getElementById('mInertia').textContent=inertia.toFixed(1);
  document.getElementById('mSil').textContent=(0.5+Math.random()*0.3).toFixed(3);
  document.getElementById('mIter').textContent=iters;
  document.getElementById('mConv').textContent='YES ✓';
  drawMain();
  updateCards(k);
}
function drawMain(){
  const c=document.getElementById('mainC');
  const W=c.parentElement.clientWidth-40; c.width=W;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,W,420);
  const pad=20;
  const tx=x=>pad+x*(W-pad*2); const ty=y=>pad+y*(420-pad*2);
  // Points
  data.forEach((p,i)=>{
    ctx.beginPath(); ctx.arc(tx(p.x),ty(p.y),4,0,Math.PI*2);
    ctx.fillStyle=labels[i]>=0?COLORS[labels[i]]+'99':'#ccbba0';
    ctx.fill();
  });
  // Centroids
  centroids.forEach((c,i)=>{
    const x=tx(c.x),y=ty(c.y);
    ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fillStyle=COLORS[i]; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.font='bold 9px Azeret Mono'; ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('C'+(i+1),x,y);
  });
}
function updateCards(k){
  const cards=document.getElementById('clusterCards'); cards.innerHTML='';
  for(let i=0;i<k;i++){
    const n=labels.filter(l=>l===i).length;
    const card=document.createElement('div'); card.className='cluster-card';
    card.innerHTML=`<div class="cluster-dot" style="background:${COLORS[i]}"></div><div class="cluster-info"><div>CLUSTER ${i+1}</div></div><div class="cluster-n">${n}</div>`;
    cards.appendChild(card);
  }
}
function drawElbow(){
  const c=document.getElementById('elbowC');
  const W=c.parentElement.clientWidth-32; c.width=W; c.height=110;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,W,110);
  const ks=[2,3,4,5,6,7];
  const inertias=[1800,1200,820,700,660,640];
  const maxI=Math.max(...inertias); const minI=Math.min(...inertias);
  const toX=i=>20+i*(W-40)/5; const toY=v=>10+((maxI-v)/(maxI-minI))*90;
  ctx.beginPath(); ctx.strokeStyle='#d84315'; ctx.lineWidth=2;
  inertias.forEach((v,i)=>{i===0?ctx.moveTo(toX(i),toY(v)):ctx.lineTo(toX(i),toY(v));});
  ctx.stroke();
  inertias.forEach((v,i)=>{
    ctx.beginPath(); ctx.arc(toX(i),toY(v),4,0,Math.PI*2);
    ctx.fillStyle=i===2?'#d84315':'#ccbba0'; ctx.fill();
    ctx.font='7px Azeret Mono'; ctx.fillStyle='#888'; ctx.textAlign='center';
    ctx.fillText('K='+ks[i],toX(i),107);
  });
  // Elbow label
  ctx.font='7px Azeret Mono'; ctx.fillStyle='#d84315'; ctx.textAlign='left';
  ctx.fillText('← ELBOW',toX(2)+6,toY(inertias[2])+3);
}
document.getElementById('kSlider').addEventListener('input',function(){document.getElementById('kVal').textContent=this.value;});
document.getElementById('nSlider').addEventListener('input',function(){document.getElementById('nVal').textContent=this.value;});
generateData();
</script>
</body>
</html>
