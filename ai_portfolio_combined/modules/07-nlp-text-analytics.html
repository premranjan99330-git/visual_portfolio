<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NLP Text Analytics</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Big+Shoulders+Display:wght@700;900&display=swap');
  :root{--bg:#1c0a2e;--surface:#2a1045;--border:#3d1a60;--purple:#b388ff;--pink:#f06292;--teal:#4dd0e1;--yellow:#fff176;--text:#e1d5f0;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Courier Prime',monospace;}
  .hdr{padding:20px 36px;border-bottom:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .brand{font-family:'Big Shoulders Display',sans-serif;font-size:1.8rem;font-weight:900;letter-spacing:3px;color:var(--purple);}
  .sub{font-size:0.6rem;color:#6a4c93;letter-spacing:3px;}
  .input-zone{padding:20px 36px;border-bottom:1px solid var(--border);}
  textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);color:var(--text);font-family:'Courier Prime',monospace;font-size:0.8rem;padding:12px;resize:vertical;min-height:80px;outline:none;}
  textarea:focus{border-color:var(--purple);}
  .btn-row{display:flex;gap:10px;margin-top:10px;}
  .btn{background:var(--purple);color:var(--bg);border:none;font-family:'Courier Prime',monospace;font-size:0.7rem;font-weight:700;padding:8px 20px;cursor:pointer;letter-spacing:1px;}
  .btn.secondary{background:transparent;border:1px solid var(--purple);color:var(--purple);}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border-top:1px solid var(--border);}
  .panel{background:var(--bg);padding:20px;}
  .p-title{font-family:'Big Shoulders Display',sans-serif;font-size:0.9rem;font-weight:700;letter-spacing:3px;color:var(--purple);margin-bottom:14px;}
  .sentiment-meter{display:flex;flex-direction:column;gap:8px;}
  .sent-bar{display:flex;align-items:center;gap:8px;}
  .sent-lbl{font-size:0.6rem;width:80px;color:#888;}
  .sent-track{flex:1;height:18px;background:var(--surface);}
  .sent-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:0.55rem;font-weight:700;}
  .sent-score{font-size:0.6rem;width:40px;text-align:right;}
  .compound-badge{display:flex;flex-direction:column;align-items:center;margin-top:16px;padding:16px;border:2px solid var(--purple);}
  .compound-val{font-family:'Big Shoulders Display',sans-serif;font-size:3rem;font-weight:900;color:var(--yellow);}
  .compound-lbl{font-size:0.55rem;letter-spacing:2px;color:#888;}
  .compound-cat{font-size:0.7rem;color:var(--teal);margin-top:4px;}
  .entity-list{display:flex;flex-direction:column;gap:6px;}
  .entity{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);}
  .entity-text{flex:1;font-size:0.7rem;}
  .entity-type{font-size:0.5rem;padding:2px 8px;border-radius:2px;letter-spacing:1px;}
  .et-per{background:#4a148c;color:#ce93d8;}
  .et-org{background:#1a237e;color:#90caf9;}
  .et-loc{background:#1b5e20;color:#a5d6a7;}
  .et-date{background:#f57f17;color:#fff;}
  .et-num{background:#880e4f;color:#f48fb1;}
  .wordcloud-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:4px;}
  .wc-word{padding:4px 10px;border-radius:2px;cursor:pointer;transition:transform 0.15s;}
  .wc-word:hover{transform:scale(1.1);}
  canvas{display:block;width:100%;}
  .token-stream{display:flex;flex-wrap:wrap;gap:4px;}
  .token{font-size:0.65rem;padding:3px 8px;border:1px solid;}
  .pos-NOUN{border-color:#b388ff;color:#b388ff;}
  .pos-VERB{border-color:#f06292;color:#f06292;}
  .pos-ADJ{border-color:#4dd0e1;color:#4dd0e1;}
  .pos-ADV{border-color:#fff176;color:#fff176;}
  .pos-OTHER{border-color:#555;color:#555;}
</style>
</head>
<body>
<div class="hdr">
  <div class="brand">NLP ANALYTICS</div>
  <div class="sub">ETHAR.AI / TEXT INTELLIGENCE / V2</div>
</div>
<div class="input-zone">
  <textarea id="inputText" placeholder="Enter text to analyze...">Ethar AI is building extraordinary machine learning solutions that transform how organizations understand and process complex data at scale. The team delivered outstanding results in Q3, exceeding all performance benchmarks by a significant margin.</textarea>
  <div class="btn-row">
    <button class="btn" onclick="analyze()">ANALYZE TEXT</button>
    <button class="btn secondary" onclick="loadSample()">LOAD SAMPLE</button>
    <span style="font-size:0.6rem;color:#555;margin-left:8px;" id="wordCount">—</span>
  </div>
</div>
<div class="grid">
  <!-- Sentiment -->
  <div class="panel">
    <div class="p-title">SENTIMENT</div>
    <div class="sentiment-meter">
      <div class="sent-bar"><div class="sent-lbl">POSITIVE</div><div class="sent-track"><div class="sent-fill" id="posBar" style="background:#69f0ae;color:#1b5e20"></div></div><div class="sent-score" id="posScore"></div></div>
      <div class="sent-bar"><div class="sent-lbl">NEGATIVE</div><div class="sent-track"><div class="sent-fill" id="negBar" style="background:#f06292;color:#880e4f"></div></div><div class="sent-score" id="negScore"></div></div>
      <div class="sent-bar"><div class="sent-lbl">NEUTRAL</div><div class="sent-track"><div class="sent-fill" id="neuBar" style="background:#90a4ae;color:#263238"></div></div><div class="sent-score" id="neuScore"></div></div>
    </div>
    <div class="compound-badge">
      <div class="compound-val" id="compVal">+0.91</div>
      <div class="compound-lbl">COMPOUND SCORE</div>
      <div class="compound-cat" id="compCat">STRONGLY POSITIVE</div>
    </div>
  </div>
  <!-- Entities -->
  <div class="panel">
    <div class="p-title">NAMED ENTITIES</div>
    <div class="entity-list" id="entityList"></div>
  </div>
  <!-- Word Frequency -->
  <div class="panel">
    <div class="p-title">TERM FREQUENCY</div>
    <canvas id="freqC" height="220"></canvas>
  </div>
  <!-- Word Cloud style -->
  <div class="panel">
    <div class="p-title">KEY TERMS</div>
    <div class="wordcloud-wrap" id="wordCloud"></div>
  </div>
  <!-- POS Tagging -->
  <div class="panel">
    <div class="p-title">POS TAGGING</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
      <span style="font-size:0.5rem;color:#b388ff">■ NOUN</span>
      <span style="font-size:0.5rem;color:#f06292">■ VERB</span>
      <span style="font-size:0.5rem;color:#4dd0e1">■ ADJ</span>
      <span style="font-size:0.5rem;color:#fff176">■ ADV</span>
      <span style="font-size:0.5rem;color:#555">■ OTHER</span>
    </div>
    <div class="token-stream" id="tokens"></div>
  </div>
  <!-- Stats -->
  <div class="panel">
    <div class="p-title">TEXT STATISTICS</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;" id="stats"></div>
  </div>
</div>
<script>
const samples=['Ethar AI is building extraordinary machine learning solutions that transform how organizations understand and process complex data at scale. The team delivered outstanding results in Q3, exceeding all performance benchmarks by a significant margin.','The model failed to converge after 100 epochs, producing terrible predictions on the test set. The data pipeline was broken and preprocessing was deeply flawed.','Natural language processing has revolutionized how computers understand text. Researchers at Stanford and MIT published groundbreaking papers on transformer architectures in 2024.'];
let si=0;
function loadSample(){si=(si+1)%samples.length;document.getElementById('inputText').value=samples[si];analyze();}
function analyze(){
  const text=document.getElementById('inputText').value;
  const words=text.trim().split(/\s+/);
  document.getElementById('wordCount').textContent=words.length+' words / '+text.length+' chars';
  // Fake sentiment based on keyword count
  const posWords=['extraordinary','outstanding','transform','exceeding','revolutionary','groundbreaking','great','excellent','outstanding'];
  const negWords=['failed','broken','terrible','flawed','bad','poor','wrong','error'];
  let posCount=0,negCount=0;
  words.forEach(w=>{
    const lw=w.toLowerCase().replace(/[^a-z]/g,'');
    if(posWords.includes(lw))posCount++;
    if(negWords.includes(lw))negCount++;
  });
  const total=Math.max(posCount+negCount+3,5);
  const pos=Math.min(0.95,(posCount+2)/total);
  const neg=Math.min(0.95,negCount/total+0.03);
  const neu=Math.max(0.05,1-pos-neg);
  document.getElementById('posBar').style.width=(pos*100)+'%';
  document.getElementById('posBar').textContent=(pos*100).toFixed(0)+'%';
  document.getElementById('negBar').style.width=(neg*100)+'%';
  document.getElementById('negBar').textContent=(neg*100).toFixed(0)+'%';
  document.getElementById('neuBar').style.width=(neu*100)+'%';
  document.getElementById('neuBar').textContent=(neu*100).toFixed(0)+'%';
  document.getElementById('posScore').textContent=(pos).toFixed(3);
  document.getElementById('negScore').textContent=(neg).toFixed(3);
  document.getElementById('neuScore').textContent=(neu).toFixed(3);
  const comp=pos-neg;
  document.getElementById('compVal').textContent=(comp>0?'+':'')+comp.toFixed(2);
  document.getElementById('compCat').textContent=comp>0.5?'STRONGLY POSITIVE':comp>0.1?'MILDLY POSITIVE':comp<-0.5?'STRONGLY NEGATIVE':comp<-0.1?'MILDLY NEGATIVE':'NEUTRAL';
  // Entities - fake extraction
  const entities=[{text:'Ethar AI',type:'ORG'},{text:'Q3',type:'DATE'},{text:'Stanford',type:'ORG'},{text:'MIT',type:'ORG'},{text:'2024',type:'DATE'},{text:'100 epochs',type:'NUM'}];
  const matching=entities.filter(e=>text.includes(e.text));
  const el=document.getElementById('entityList'); el.innerHTML='';
  matching.forEach(e=>{
    const div=document.createElement('div'); div.className='entity';
    div.innerHTML=`<span class="entity-text">${e.text}</span><span class="entity-type et-${e.type.toLowerCase()}">${e.type}</span>`;
    el.appendChild(div);
  });
  // Freq
  const freq={};
  words.forEach(w=>{const lw=w.toLowerCase().replace(/[^a-z]/g,'');if(lw.length>3)freq[lw]=(freq[lw]||0)+1;});
  const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10);
  drawFreq(sorted);
  // Word cloud
  const wc=document.getElementById('wordCloud'); wc.innerHTML='';
  sorted.slice(0,15).forEach(([w,c])=>{
    const el=document.createElement('span'); el.className='wc-word';
    const sz=12+c*4; el.style.fontSize=sz+'px';
    const cols=['#b388ff','#f06292','#4dd0e1','#fff176','#80cbc4'];
    el.style.color=cols[Math.floor(Math.random()*cols.length)];
    el.style.background=cols[Math.floor(Math.random()*cols.length)]+'15';
    el.textContent=w; wc.appendChild(el);
  });
  // POS
  const posMap={machine:'NOUN',learning:'NOUN',building:'VERB',extraordinary:'ADJ',transform:'VERB',organizations:'NOUN',understand:'VERB',data:'NOUN',scale:'NOUN',delivered:'VERB',outstanding:'ADJ',results:'NOUN',exceeding:'VERB',significantly:'ADV',deeply:'ADV',revolutionary:'ADJ',published:'VERB',groundbreaking:'ADJ'};
  const tokenDiv=document.getElementById('tokens'); tokenDiv.innerHTML='';
  words.slice(0,30).forEach(w=>{
    const lw=w.toLowerCase().replace(/[^a-z]/g,'');
    const pos=posMap[lw]||'OTHER';
    const span=document.createElement('span'); span.className=`token pos-${pos}`; span.textContent=w;
    tokenDiv.appendChild(span);
  });
  // Stats
  const sents=text.split(/[.!?]+/).filter(s=>s.trim().length>0);
  const statsDiv=document.getElementById('stats'); statsDiv.innerHTML='';
  const statItems=[['WORDS',words.length],['SENTENCES',sents.length],['AVG WORD LEN',(text.replace(/\s/g,'').length/words.length).toFixed(1)],['UNIQUE WORDS',Object.keys(freq).length],['LEXICAL DENSITY',(Object.keys(freq).length/words.length*100).toFixed(0)+'%'],['AVG SENT LEN',(words.length/Math.max(sents.length,1)).toFixed(0)+' w']];
  statItems.forEach(([l,v])=>{
    const d=document.createElement('div'); d.style.cssText='border:1px solid #3d1a60;padding:10px;';
    d.innerHTML=`<div style="font-size:0.5rem;color:#888;letter-spacing:2px">${l}</div><div style="font-family:Big Shoulders Display,sans-serif;font-size:1.6rem;font-weight:700;color:#b388ff">${v}</div>`;
    statsDiv.appendChild(d);
  });
}
function drawFreq(sorted){
  const c=document.getElementById('freqC'); c.width=c.parentElement.clientWidth-40;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,220);
  if(!sorted.length)return;
  const maxV=sorted[0][1]; const n=sorted.length;
  const bH=(200-20)/n;
  sorted.forEach(([w,cnt],i)=>{
    const y=i*bH+2; const barW=(cnt/maxV)*(c.width-120);
    ctx.fillStyle=`hsl(${270+i*12},70%,65%)`;
    ctx.fillRect(80,y,barW,bH-3);
    ctx.font='8px Courier Prime'; ctx.fillStyle='#888'; ctx.textAlign='right';
    ctx.fillText(w,74,y+bH/2+3);
    ctx.fillStyle='#444'; ctx.textAlign='left';
    ctx.fillText(cnt,82+barW,y+bH/2+3);
  });
}
analyze();
</script>
</body>
</html>
